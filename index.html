<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홍익북스</title>
<meta name="description" content="홍익북스 — 스키 책과 책 속 영상 안내">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#1B2A41;--bg:#EEF3F8;--line:#D7E3EF;--soft:#4A5B70;--accent:#1E6FD9;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--navy);padding:48px 16px}
main{max-width:720px;margin:0 auto}
h1{font-size:30px;letter-spacing:-.02em}
.lead{color:var(--soft);margin:8px 0 28px;line-height:1.6}
.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:14px}
.book h2{font-size:22px;letter-spacing:-.02em}
.book .sub{color:var(--soft);margin:4px 0 12px}
.book a{color:var(--accent);font-weight:700;text-decoration:none}
footer{margin-top:28px;font-size:13px;color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1>홍익북스</h1>
  <p class="lead">책에 실린 QR 영상과 업데이트 안내를 모아 두는 곳입니다.</p>
  <section class="book">
    <h2>『스키 위에 서라』</h2>
    <p class="sub">초중급 스키어를 위한 베이직 가이드 · 홍선의 지음</p>
    <a href="stand/">책 속 영상 목록 →</a>
  </section>
  <footer>© 홍익북스</footer>
</main>
</body>
</html>
